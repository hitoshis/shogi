<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>茨城新聞社杯県南予選</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff;
      --panel: #fff;
      --panel-2: #fff;
      --line: #999;
      --text: #111;
      --muted: #666;
      --gold: #111;
      --green: #111;
      --font-jp: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      --card-h: 30px;
      --gap: 3px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body {
      color: var(--text);
      font-family: var(--font-jp);
      overflow-x: hidden;
    }

    .app { display: none; }
    body.authenticated .app { display: block; }
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff;
    }
    body.authenticated .login-screen { display: none; }
    .login-box {
      width: min(360px, 100%);
      padding: 30px;
      border: 1px solid #bbb;
      text-align: center;
      background: #fff;
    }
    .login-box h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: .08em; }
    .login-box p { margin: 0 0 20px; color: #666; font-size: 13px; }
    .login-box input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #999;
      border-radius: 0;
      background: #fff;
      color: #111;
      font: inherit;
    }
    .login-box button {
      width: 100%;
      height: 42px;
      margin-top: 10px;
      border: 1px solid #111;
      border-radius: 0;
      background: #111;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    .login-box button:hover { background: #333; }
    .login-error { min-height: 20px; margin-top: 10px; color: #b00020; font-size: 12px; }

    .app {
      width: min(1920px, 100vw);
      min-height: 100vh;
      margin: 0 auto;
      padding: 14px 22px 16px;
      background: var(--bg);
    }

    header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 10px;
    }

    .header-tools { display: flex; align-items: center; gap: 14px; }
    .highlight-button {
      height: 34px;
      padding: 0 13px;
      border: 1px solid #999;
      background: #fff;
      color: #111;
      font-family: var(--font-jp);
      font-size: 12px;
      cursor: pointer;
    }
    .highlight-button:hover { background: #f5f5f5; }
    .highlight-button[aria-pressed="true"] { background: #ffe45c; border-color: #b79a00; }
    .row-toggles {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      white-space: nowrap;
    }
    .row-toggle { display: flex; align-items: center; gap: 3px; cursor: pointer; }
    .row-toggle input { width: 15px; height: 15px; margin: 0; accent-color: #555; }
    body.highlight-top-eight .top-eight { background: #fff2a8 !important; }

    h1 { margin: 0; font-family: var(--font-jp); font-size: 27px; letter-spacing: .13em; }
    h1 span { color: var(--gold); }
    .meta { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .meta b { color: var(--text); font-size: 15px; }

    .rounds {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      min-width: 0;
    }

    .round {
      min-width: 0;
      background: rgba(17, 29, 23, .72);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px;
      box-shadow: 0 10px 28px rgba(0,0,0,.17);
    }

    .round-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      height: 29px;
      padding: 0 3px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .round-title span { color: var(--green); font-size: 11px; font-weight: 500; letter-spacing: 0; }
    .matches { display: grid; gap: var(--gap); }

    .match {
      position: relative;
      height: var(--card-h);
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      overflow: hidden;
      border: 1px solid #30483c;
      border-radius: 4px;
      background: var(--panel-2);
    }
    .match::after {
      content: "";
      position: absolute;
      top: 4px; bottom: 4px; left: 50%;
      width: 1px; background: #3b5447;
    }
    .player {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 6px;
      font-size: 11.5px;
      color: #aab8b0;
      white-space: nowrap;
    }
    .player:last-child { justify-content: flex-end; text-align: right; }
    .player.winner { color: #fff; font-weight: 800; background: linear-gradient(90deg, rgba(233,185,73,.14), transparent); }
    .player:last-child.winner { background: linear-gradient(270deg, rgba(233,185,73,.14), transparent); }
    .winner .name::before { content: "勝 "; color: var(--gold); font-size: 9px; }
    .ticket { color: #6f887a; font: 9px/1 ui-monospace, monospace; }
    .winner .ticket { color: #c19a43; }
    .name { overflow: hidden; text-overflow: ellipsis; }
    .absent { opacity: .42; text-decoration: line-through; }

    .group-break { margin-top: 5px; }
    .group-break::before {
      content: attr(data-group);
      position: absolute;
      z-index: 2;
      left: 50%; top: -5px;
      transform: translateX(-50%);
      padding: 0 4px;
      color: #789183;
      background: var(--panel);
      font: 8px/10px ui-monospace, monospace;
    }

    .empty-note {
      margin-top: 6px;
      padding: 8px;
      text-align: center;
      border: 1px dashed #355044;
      border-radius: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    footer { display: flex; justify-content: space-between; margin-top: 7px; color: #71867a; font-size: 10px; }
    .legend { display: flex; gap: 14px; }
    .legend b { color: var(--gold); }

    @media (max-width: 1100px) {
      body { overflow-x: auto; }
      .app { width: 1920px; }
    }
    @media (min-height: 1050px) { :root { --card-h: 31px; --gap: 3px; } }
    @media (max-height: 950px) { :root { --card-h: 27px; --gap: 2px; } .app { padding-top: 7px; } header { height: 48px; } }
    @media print {
      @page { size: A3 landscape; margin: 7mm; }
      .app { width: 100%; padding: 0; }
      body { background: #fff; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }

    /* 56名を横一列に並べる勝敗表 */
    .table-wrap {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fff;
    }
    .results-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
    }
    .results-table th, .results-table td {
      border-right: 1px solid #999;
      border-bottom: 1px solid #999;
      text-align: center;
      padding: 0;
    }
    .results-table tr > *:last-child { border-right: 0; }
    .results-table tbody tr:last-child > * { border-bottom: 0; }
    .corner, .round-label { width: 58px; min-width: 58px; }
    .corner {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .08em;
      background: #f5f5f5;
    }
    .name-head {
      height: 300px;
      vertical-align: middle;
      background: #fff;
    }
    .name-cell {
      height: 294px;
      margin: 3px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
      color: var(--text);
      font-family: var(--font-jp);
      font-size: clamp(14px, .85vw, 17px);
      letter-spacing: .08em;
    }
    .name-cell .head-id {
      color: #555;
      font: 9px/1 ui-monospace, monospace;
      letter-spacing: 0;
    }
    .name-cell .vertical-name {
      writing-mode: vertical-rl;
      text-orientation: upright;
    }
    .round-label {
      height: 76px;
      color: #111;
      background: #f5f5f5;
      font-size: 13px;
      letter-spacing: .08em;
      white-space: nowrap;
    }
    .result-cell {
      position: relative;
      height: 76px;
      background: #fff;
      font-family: var(--font-jp);
      font-size: clamp(17px, 1.35vw, 25px);
      font-weight: 800;
    }
    .result-cell.win { color: #1a1a1a; background: #fff; }
    .result-cell.loss { color: #1a1a1a; }
    .result-cell.absence { color: #777; font-size: 14px; background: #f7f7f7; }
    .result-cell.none { color: #aaa; font-size: 15px; }
    .opponent-id {
      position: absolute;
      top: 4px;
      right: 4px;
      color: #555;
      font: 9px/1 ui-monospace, monospace;
    }
    .summary-row > * { border-top: 2px solid #555; }
    .summary-row + .summary-row > * { border-top: 1px solid #999; }
    .summary-label, .summary-cell {
      height: 64px;
      background: #f5f5f5;
      color: #111;
      font-weight: 800;
    }
    .summary-label { font-size: 12px; white-space: nowrap; }
    .summary-cell { font-size: clamp(15px, 1.1vw, 21px); }
    .table-caption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 9px;
      color: var(--muted);
      font-size: 11px;
    }
    .table-caption .symbols { display: flex; gap: 18px; }
    .table-caption .win-mark { color: #1a1a1a; }
    .table-caption .loss-mark { color: #1a1a1a; }
    @media (max-width: 1100px) {
      .table-wrap { overflow-x: auto; }
      .results-table { min-width: 1840px; }
    }
    @media (max-height: 850px) {
      .name-head { height: 245px; }
      .name-cell { height: 239px; font-size: 14px; }
      .round-label, .result-cell { height: 61px; }
    }
  </style>
</head>
<body>
  <section class="login-screen" aria-label="パスワード認証">
    <form class="login-box" id="login-form">
      <h1>将棋大会 対戦表</h1>
      <p>閲覧パスワードを入力してください</p>
      <input id="password" type="password" autocomplete="current-password" aria-label="パスワード" required autofocus>
      <button type="submit">表示する</button>
      <div class="login-error" id="login-error" role="alert" aria-live="polite"></div>
    </form>
  </section>
  <main class="app">
    <header>
      <h1>茨城新聞社杯県南予選</h1>
      <div class="header-tools">
        <button class="highlight-button" id="highlight-button" type="button" aria-pressed="false">上位8名を強調</button>
        <div class="row-toggles" aria-label="集計行の表示切替">
          <label class="row-toggle"><input id="show-sc" type="checkbox" checked>SC</label>
          <label class="row-toggle"><input id="show-sb" type="checkbox" checked>SB</label>
        </div>
        <div class="meta"><b id="player-count"></b>名参加　｜　最終更新 <span id="updated-at"></span></div>
      </div>
    </header>
    <section class="table-wrap" aria-label="56名の回戦別勝敗表">
      <table class="results-table" id="results-table"></table>
    </section>
    <div class="table-caption">
      <div class="symbols"><span class="win-mark">○ 勝ち</span><span class="loss-mark">● 負け</span><span>欠 欠席</span></div>
      <div>選手56名 × 全5回戦｜1920px フルスクリーン表示対応</div>
    </div>
  </main>

  <script>
    const PASSWORD_HASH = '379fb1eb999bfb776c12bc25e7d4c248ab718490f43c760e51c641ab083b0779';
    const AUTH_KEY = 'shogi-tournament-authenticated';
    const loginForm = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const loginError = document.getElementById('login-error');

    const sha256 = async value => {
      const bytes = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, '0')).join('');
    };

    const unlock = () => {
      document.body.classList.add('authenticated');
      sessionStorage.setItem(AUTH_KEY, 'true');
    };

    if (sessionStorage.getItem(AUTH_KEY) === 'true') unlock();

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      loginError.textContent = '';
      if (await sha256(passwordInput.value) === PASSWORD_HASH) {
        unlock();
        passwordInput.value = '';
      } else {
        loginError.textContent = 'パスワードが違います。';
        passwordInput.select();
      }
    });
  </script>
  <script>
    const data = JSON.parse(document.getElementById('tournament-data').textContent);
    const players = new Map(data.players.map(player => [player.id, player]));
    const tableEl = document.getElementById('results-table');

    document.getElementById('player-count').textContent = data.players.length;
    document.getElementById('updated-at').textContent = new Intl.DateTimeFormat('ja-JP', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    }).format(new Date(data.updatedAt));

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const corner = document.createElement('th');
    corner.className = 'corner';
    corner.textContent = '回戦';
    headRow.append(corner);
    data.players.forEach(player => {
      const th = document.createElement('th');
      th.className = 'name-head';
      const label = document.createElement('div');
      label.className = 'name-cell';
      const id = document.createElement('span');
      id.className = 'head-id';
      id.textContent = player.id;
      const name = document.createElement('span');
      name.className = 'vertical-name';
      name.textContent = player.name.replace(/[　\s]+/g, '');
      label.append(id, name);
      th.append(label);
      headRow.append(th);
    });
    thead.append(headRow);

    const tbody = document.createElement('tbody');
    data.rounds.forEach((round, roundIndex) => {
      const row = document.createElement('tr');
      const label = document.createElement('th');
      label.className = 'round-label';
      label.scope = 'row';
      label.textContent = `第${roundIndex + 1}回戦`;
      row.append(label);

      const results = new Map();
      round.forEach(match => {
        results.set(match.a, {
          outcome: match.result === 'A' ? 'win' : 'loss',
          opponentId: match.b
        });
        results.set(match.b, {
          outcome: match.result === 'B' ? 'win' : 'loss',
          opponentId: match.a
        });
      });
      const absentIds = new Set(data.absences?.[roundIndex] || []);
      data.players.forEach(player => {
        const td = document.createElement('td');
        const result = results.get(player.id);
        if (absentIds.has(player.id)) {
          td.className = 'result-cell absence';
          td.textContent = '欠';
          td.title = `${player.name}：欠席`;
        } else if (result?.outcome === 'win') {
          td.className = 'result-cell win';
          td.textContent = '○';
          td.title = `${player.name}：勝ち`;
        } else if (result?.outcome === 'loss') {
          td.className = 'result-cell loss';
          td.textContent = '●';
          td.title = `${player.name}：負け`;
        } else {
          td.className = 'result-cell none';
          td.textContent = '－';
          td.title = `${player.name}：対局なし`;
        }
        if (result && !absentIds.has(player.id)) {
          const opponentId = document.createElement('span');
          opponentId.className = 'opponent-id';
          opponentId.textContent = result.opponentId;
          opponentId.title = `対戦相手ID：${result.opponentId}`;
          td.append(opponentId);
        }
        row.append(td);
      });
      tbody.append(row);
    });

    const winCounts = new Map(data.players.map(player => [player.id, 0]));
    const winPoints = new Map(data.players.map(player => [player.id, 50]));
    const opponentIds = new Map(data.players.map(player => [player.id, []]));
    const defeatedOpponentIds = new Map(data.players.map(player => [player.id, []]));
    const absentPlayerIds = new Set((data.absences || []).flat());
    data.rounds.forEach((round, roundIndex) => {
      const lossPenalty = 10 - roundIndex;
      round.forEach(match => {
        const winnerId = match.result === 'A' ? match.a : match.b;
        const loserId = match.result === 'A' ? match.b : match.a;
        winCounts.set(winnerId, winCounts.get(winnerId) + 1);
        winPoints.set(loserId, winPoints.get(loserId) - lossPenalty);
        opponentIds.get(match.a).push(match.b);
        opponentIds.get(match.b).push(match.a);
        defeatedOpponentIds.get(winnerId).push(loserId);
      });
    });

    const solkoffScores = new Map(data.players.map(player => [
      player.id,
      opponentIds.get(player.id).reduce((total, opponentId) => total + winCounts.get(opponentId), 0)
    ]));
    const sbScores = new Map(data.players.map(player => [
      player.id,
      defeatedOpponentIds.get(player.id).reduce(
        (total, opponentId) => total + winCounts.get(opponentId),
        0
      )
    ]));

    const rankedPlayers = data.players
      .filter(player => !absentPlayerIds.has(player.id))
      .sort((left, right) =>
        winCounts.get(right.id) - winCounts.get(left.id) ||
        winPoints.get(right.id) - winPoints.get(left.id) ||
        solkoffScores.get(right.id) - solkoffScores.get(left.id) ||
        sbScores.get(right.id) - sbScores.get(left.id)
      );
    const rankings = new Map();
    let previousScore = null;
    let previousRank = 0;
    rankedPlayers.forEach((player, index) => {
      const wins = winCounts.get(player.id);
      const score = wins === 5
        ? 'perfect-score'
        : [
            wins,
            winPoints.get(player.id),
            solkoffScores.get(player.id),
            sbScores.get(player.id)
          ].join(':');
      const rank = score === previousScore ? previousRank : index + 1;
      rankings.set(player.id, rank);
      previousScore = score;
      previousRank = rank;
    });

    const appendSummaryRow = (labelText, values, suffix = '') => {
      const row = document.createElement('tr');
      row.className = 'summary-row';
      const label = document.createElement('th');
      label.className = 'summary-label';
      label.scope = 'row';
      label.textContent = labelText;
      row.append(label);
      data.players.forEach(player => {
        const td = document.createElement('td');
        td.className = 'summary-cell';
        td.textContent = absentPlayerIds.has(player.id)
          ? 'ー'
          : `${values.get(player.id)}${suffix}`;
        row.append(td);
      });
      tbody.append(row);
      return row;
    };

    appendSummaryRow('勝ち数', winCounts);
    appendSummaryRow('勝ち点', winPoints);
    const scRow = appendSummaryRow('SC', solkoffScores);
    const sbRow = appendSummaryRow('SB', sbScores);
    appendSummaryRow('順位', rankings);
    tableEl.append(thead, tbody);

    const topEightIds = new Set(rankedPlayers.slice(0, 8).map(player => player.id));
    data.players.forEach((player, playerIndex) => {
      if (!topEightIds.has(player.id)) return;
      tableEl.querySelectorAll(`tr > *:nth-child(${playerIndex + 2})`)
        .forEach(cell => cell.classList.add('top-eight'));
    });

    const highlightButton = document.getElementById('highlight-button');
    highlightButton.addEventListener('click', () => {
      const enabled = document.body.classList.toggle('highlight-top-eight');
      highlightButton.setAttribute('aria-pressed', String(enabled));
      highlightButton.textContent = enabled ? '強調を解除' : '上位8名を強調';
    });

    const bindRowToggle = (checkboxId, row) => {
      const checkbox = document.getElementById(checkboxId);
      checkbox.addEventListener('change', () => {
        row.hidden = !checkbox.checked;
      });
    };
    bindRowToggle('show-sc', scRow);
    bindRowToggle('show-sb', sbRow);
  </script>
