<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>茨城新聞社杯県南予選</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="login-screen" aria-label="パスワード認証">
    <form class="login-box" id="login-form">
      <h1>将棋大会 対戦表</h1>
      <p>閲覧パスワードを入力してください</p>
      <input id="password" type="password" autocomplete="current-password" aria-label="パスワード" required autofocus>
      <button type="submit">表示する</button>
      <div class="login-error" id="login-error" role="alert" aria-live="polite"></div>
    </form>
  </section>
  <main class="app">
    <header>
      <h1>茨城新聞社杯県南予選</h1>
      <div class="header-tools">
        <button class="highlight-button" id="highlight-button" type="button" aria-pressed="false">上位8名を強調</button>
        <div class="row-toggles" aria-label="集計行の表示切替">
          <label class="row-toggle"><input id="show-sc" type="checkbox" checked>SC</label>
          <label class="row-toggle"><input id="show-sb" type="checkbox" checked>SB</label>
        </div>
        <div class="meta"><b id="player-count"></b>名参加　｜　最終更新 <span id="updated-at"></span></div>
      </div>
    </header>
    <section class="table-wrap" aria-label="回戦別勝敗表">
      <p class="data-error" id="data-error" hidden></p>
      <table class="results-table" id="results-table"></table>
    </section>
    <div class="table-caption">
      <div class="symbols"><span class="win-mark">○ 勝ち</span><span class="loss-mark">● 負け</span><span>欠 欠席</span></div>
      <div>選手<span id="caption-player-count"></span>名 × <span id="round-progress"></span>｜1920px フルスクリーン表示対応</div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
