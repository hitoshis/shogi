name: Deploy tournament to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - tournament.html
      - styles.css
      - app.js
      - shogi-tournament-backup-20260824.json
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Validate and prepare site
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(
            fs.readFileSync('shogi-tournament-backup-20260824.json', 'utf8')
          );
          if (data.players.length !== 56 || data.rounds.length !== 5) {
            throw new Error('想定した大会データ（56名・5回戦）ではありません。');
          }
          NODE

          node --check app.js
          mkdir -p _site
          cp tournament.html _site/index.html
          cp styles.css app.js shogi-tournament-backup-20260824.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
